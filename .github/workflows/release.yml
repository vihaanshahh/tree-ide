name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build (mac arm64 + x64 dmgs)
        run: npm run dist

      - name: Create version-less aliases
        working-directory: dist
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          cp "Tree-${v}-arm64.dmg" "Tree-arm64.dmg"
          cp "Tree-${v}.dmg"        "Tree-x64.dmg"
          ls -la *.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/Tree-*-arm64.dmg
            dist/Tree-*.dmg
            dist/Tree-arm64.dmg
            dist/Tree-x64.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build (windows x64 installer)
        run: npm run dist:win

      - name: Create version-less alias
        shell: pwsh
        working-directory: dist
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          Copy-Item "Tree-Setup-$v.exe" "Tree-Setup.exe"
          Get-ChildItem *.exe

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            dist/Tree-Setup-*.exe
            dist/Tree-Setup.exe
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "Tree IDE ${{ github.ref_name }}"
          files: |
            artifacts/Tree-*.dmg
            artifacts/Tree-Setup*.exe
