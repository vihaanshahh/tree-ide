name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Code-signing / notarization are OPTIONAL. When these repo secrets are set the
# mac builds are signed + notarized (which is what makes in-app auto-update work
# on macOS); when they are absent the builds are still produced, just unsigned.
#   MAC_CSC_LINK                 base64 of the Developer ID .p12
#   MAC_CSC_KEY_PASSWORD         password for that .p12
#   APPLE_ID                     Apple Developer account email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password from appleid.apple.com
#   APPLE_TEAM_ID                10-char Team ID
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and whether to release
        id: v
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${tag} — will tag and release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.v.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"

  build-mac:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13   # Intel runner → correct x86_64 native modules
            arch: x64
          - runner: macos-14   # Apple Silicon runner → correct arm64 native modules
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (rebuilds native modules for ${{ matrix.arch }})
        run: npm ci

      - name: Build ${{ matrix.arch }} (dmg + zip)
        env:
          # Mapped under MAC_* so electron-builder doesn't pick up an empty
          # CSC_LINK (an empty string makes it look for a cert file and fail).
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          npm run build:icon
          if [ -n "${MAC_CSC_LINK:-}" ]; then
            echo "Developer ID cert present — building signed."
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-}"
          else
            echo "No signing cert — building unsigned (arch-correct)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Stage artifacts (versionless dmg alias + arch-tagged update metadata)
        working-directory: dist
        env:
          V: ${{ needs.check.outputs.version }}
          A: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "$A" = "arm64" ]; then
            cp "Tree-${V}-arm64.dmg" "Tree-arm64.dmg"
          else
            cp "Tree-${V}.dmg" "Tree-x64.dmg"
          fi
          # Rename so the two arch jobs don't collide; merged back in the release job.
          cp latest-mac.yml "latest-mac-${A}.yml"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.blockmap
            dist/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error

  build-win:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build (windows x64 installer)
        run: npm run dist:win

      - name: Create version-less alias
        shell: pwsh
        working-directory: dist
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          Copy-Item "Tree-Setup-$env:V.exe" "Tree-Setup.exe"
          Get-ChildItem *.exe

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            dist/Tree-Setup-*.exe
            dist/Tree-Setup.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    needs: [check, build-mac, build-win]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge per-arch mac update metadata
        run: |
          set -euo pipefail
          npm i js-yaml@4 --no-save --no-audit --no-fund
          node scripts/merge-mac-latest-yml.js artifacts
          echo "=== release assets ==="
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          name: "Tree IDE ${{ needs.check.outputs.tag }}"
          files: |
            artifacts/Tree-*.dmg
            artifacts/Tree-*-mac.zip
            artifacts/Tree-Setup*.exe
            artifacts/*.blockmap
            artifacts/latest-mac.yml
            artifacts/latest.yml
