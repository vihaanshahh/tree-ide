name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and whether to release
        id: v
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${tag} — will tag and release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.v.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"

  build-mac:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build (mac arm64 + x64 dmgs)
        run: npm run dist

      - name: Create version-less aliases
        working-directory: dist
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          cp "Tree-${V}-arm64.dmg" "Tree-arm64.dmg"
          cp "Tree-${V}.dmg"        "Tree-x64.dmg"
          ls -la *.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/Tree-*-arm64.dmg
            dist/Tree-*.dmg
            dist/Tree-arm64.dmg
            dist/Tree-x64.dmg
          if-no-files-found: error

  build-win:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build (windows x64 installer)
        run: npm run dist:win

      - name: Create version-less alias
        shell: pwsh
        working-directory: dist
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          Copy-Item "Tree-Setup-$env:V.exe" "Tree-Setup.exe"
          Get-ChildItem *.exe

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            dist/Tree-Setup-*.exe
            dist/Tree-Setup.exe
          if-no-files-found: error

  release:
    needs: [check, build-mac, build-win]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          name: "Tree IDE ${{ needs.check.outputs.tag }}"
          files: |
            artifacts/Tree-*.dmg
            artifacts/Tree-Setup*.exe
